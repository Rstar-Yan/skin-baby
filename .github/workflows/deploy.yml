name: 肤小宝 CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'uniapp/**'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        type: string
      desc:
        description: '版本描述'
        required: false
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uni-app deps
        working-directory: uniapp
        run: npm install --legacy-peer-deps --loglevel verbose

      - name: Build mp-weixin
        working-directory: uniapp
        run: npm run build:mp-weixin 2>&1 | tail -80

      - name: Set version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version || github.run_number }}" >> $GITHUB_OUTPUT
            echo "desc=${{ github.event.inputs.desc || '手动上传' }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "desc=push #${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to WeChat
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          echo "$WX_PRIVATE_KEY" > /tmp/wx_private.key
          npx miniprogram-ci upload \
            --pp ./uniapp/dist/build/mp-weixin \
            --pkp /tmp/wx_private.key \
            --appid "$WX_APPID" \
            --uv "${{ steps.ver.outputs.version }}" \
            --ud "${{ steps.ver.outputs.desc }}"