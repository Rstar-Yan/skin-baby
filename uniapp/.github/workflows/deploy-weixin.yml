name: 肤小宝 · 微信小程序自动上传

on:
  push:
    branches: [main, master]
    paths:
      - 'uniapp/src/**'
      - 'uniapp/package.json'
      - 'uniapp/vite.config.js'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.1）'
        required: false
        default: '1.0.0'
      description:
        description: '版本描述'
        required: false
        default: 'CI 自动构建上传'

concurrency:
  group: weixin-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniapp

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: uniapp/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 编译微信小程序
        run: npm run build:mp-weixin

      - name: 写入微信上传私钥
        env:
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          if [ -n "$WX_PRIVATE_KEY" ]; then
            # 用环境变量传递避免 shell 转义问题
            echo "$WX_PRIVATE_KEY" > /tmp/wx-private-key.pem
            echo "私钥已写入临时文件 ($(wc -c < /tmp/wx-private-key.pem) bytes)"
          else
            echo "WX_PRIVATE_KEY 未设置，跳过上传"
            exit 1
          fi

      - name: 上传微信体验版
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_UPLOAD_KEY_PATH: /tmp/wx-private-key.pem
          WX_ROBOT: ${{ secrets.WX_ROBOT || '1' }}
        run: node deploy/upload.js --version ${{ github.event.inputs.version || '1.0.0' }} --desc "${{ github.event.inputs.description || 'CI 自动构建上传' }}"
